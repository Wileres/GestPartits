; /etc/php/8.5/fpm/conf.d/99-gestpartits.ini (i el mateix a /etc/php/8.5/cli/conf.d/)
expose_php = Off
display_errors = Off
log_errors = On
memory_limit = 256M
upload_max_filesize = 4M
post_max_size = 6M
max_execution_time = 60
date.timezone = UTC

session.cookie_httponly = 1
session.cookie_secure = 1
session.use_strict_mode = 1

opcache.enable = 1
opcache.memory_consumption = 128
opcache.validate_timestamps = 0
