# /etc/apache2/sites-available/gestpartits.conf
# Mòduls: a2enmod ssl rewrite headers proxy_fcgi setenvif && a2enconf php8.5-fpm

<VirtualHost *:80>
    ServerName partits.example.org
    Redirect permanent / https://partits.example.org/
</VirtualHost>

<VirtualHost *:443>
    ServerName partits.example.org
    DocumentRoot /var/www/gestpartits/public

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/partits.example.org/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/partits.example.org/privkey.pem
    SSLProtocol -all +TLSv1.2 +TLSv1.3

    ServerSignature Off
    LimitRequestBody 4194304

    <Directory /var/www/gestpartits/public>
        AllowOverride None
        Require all granted
        Options -Indexes +FollowSymLinks

        RewriteEngine On
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteRule ^ index.php [L]
    </Directory>

    # Només s'executa index.php.
    <FilesMatch "\.php$">
        Require all denied
    </FilesMatch>
    <Files "index.php">
        Require all granted
        SetHandler "proxy:unix:/run/php/php8.5-fpm.sock|fcgi://localhost"
    </Files>

    <LocationMatch "^/build/">
        Header set Cache-Control "public, max-age=31536000, immutable"
    </LocationMatch>

    <DirectoryMatch "/\.(?!well-known)">
        Require all denied
    </DirectoryMatch>

    ErrorLog ${APACHE_LOG_DIR}/gestpartits-error.log
    CustomLog ${APACHE_LOG_DIR}/gestpartits-access.log combined
</VirtualHost>
