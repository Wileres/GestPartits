# /etc/nginx/sites-available/gestpartits.conf
# HTTPS obligatori. Certificat amb certbot: certbot --nginx -d partits.example.org

server {
    listen 80;
    listen [::]:80;
    server_name partits.example.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name partits.example.org;

    root /var/www/gestpartits/public;
    index index.php;
    charset utf-8;

    ssl_certificate /etc/letsencrypt/live/partits.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/partits.example.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Mida màxima de les pujades (escuts de 2 MB + marge).
    client_max_body_size 4m;

    # Les capçaleres de seguretat (CSP, HSTS...) les afegeix l'aplicació.
    server_tokens off;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Assets compilats per Vite: caché llarga (els noms porten hash).
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Només s'executa public/index.php. Cap altre fitxer .php (ni pujat ni copiat) no s'executa.
    location = /index.php {
        fastcgi_pass unix:/run/php/php8.5-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 120s;
    }

    location ~ \.php$ {
        return 404;
    }

    # Fitxers ocults (.env, .git...).
    location ~ /\.(?!well-known) {
        deny all;
    }
}
